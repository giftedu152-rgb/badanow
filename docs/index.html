<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>바다나우 BADANOW | 부산 해변 시설 지도</title>
    <meta
      name="description"
      content="광안리, 해운대, 송정 해수욕장의 편의시설과 위험요소를 지도와 스마트 순위로 확인하세요."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      :root {
        --navy: #062b68;
        --blue: #087fca;
        --cyan: #19aee6;
        --sky: #eaf8ff;
        --ink: #17324a;
        --muted: #65798b;
        --line: #d9e7ef;
        --white: #fff;
        --yellow: #f7bf2a;
        --red: #eb4d43;
        --green: #26a56a;
        --shadow: 0 12px 36px #06367115;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #f4f9fc;
        color: var(--ink);
        font-family: Pretendard, system-ui, sans-serif;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .shell {
        max-width: 1180px;
        margin: auto;
        padding: 0 20px;
      }
      .hero {
        color: #fff;
        background:
          radial-gradient(circle at 88% 15%, #24c1f055, transparent 28%),
          linear-gradient(135deg, #042860, #086cae 58%, #09a9d3);
        padding: 18px 0 54px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        filter: drop-shadow(0 6px 14px #001f5a55);
      }
      .brand b {
        font-size: 25px;
        letter-spacing: -0.02em;
      }
      .brand small {
        display: block;
        opacity: 0.75;
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      .lang {
        border: 1px solid #ffffff66;
        background: #ffffff18;
        color: #fff;
        border-radius: 12px;
        padding: 10px;
      }
      .lang option {
        color: #132f44;
      }
      .hero-copy {
        max-width: 730px;
        padding: 64px 0 10px;
      }
      .hero-copy .kicker {
        font-size: 12px;
        letter-spacing: 0.16em;
        font-weight: 800;
        color: #9fe8ff;
      }
      .hero-copy h1 {
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1.06;
        margin: 14px 0;
      }
      .hero-copy p {
        font-size: 18px;
        line-height: 1.6;
        margin: 0;
        color: #ddf7ff;
      }
      .mock-note {
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 13px;
        border-radius: 999px;
        background: #001a4533;
        border: 1px solid #ffffff44;
        font-size: 13px;
      }
      .beach-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
        position: relative;
        z-index: 2;
      }
      main.shell { padding-top: 28px; }
      .mode-switcher {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 0;
        position: relative;
        z-index: 3;
      }
      .mode-btn {
        background: #ffffffec;
        border: 1px solid #cfe0ea;
        border-radius: 17px;
        box-shadow: var(--shadow);
        color: #426071;
        font-size: 16px;
        font-weight: 850;
        padding: 18px;
        transition: transform .22s ease, background .22s ease, color .22s ease, box-shadow .22s ease;
      }
      .mode-btn:hover { transform: translateY(-2px); }
      .mode-btn.on {
        background: linear-gradient(135deg, var(--navy), var(--blue));
        border-color: transparent;
        box-shadow: 0 13px 28px #06367135;
        color: #fff;
      }
      .view-panel {
        animation: viewIn .32s ease both;
        position: relative;
        z-index: 1;
      }
      .view-panel[hidden] { display: none; }
      @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .beach-tab {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--shadow);
        color: var(--muted);
        font-weight: 750;
      }
      .beach-tab.on {
        color: #fff;
        border-color: var(--blue);
        background: linear-gradient(135deg, var(--navy), var(--blue));
        transform: translateY(-3px);
      }
      .section {
        padding: 34px 0;
      }
      .compare-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .compare-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 19px;
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .compare-card-head { align-items: baseline; display: flex; gap: 9px; justify-content: space-between; margin-bottom: 14px; }
      .compare-card h3 { margin: 0; font-size: 20px; }
      .compare-distance { color: var(--blue); font-size: 13px; font-weight: 800; white-space: nowrap; }
      .compare-stats { display: grid; gap: 8px; }
      .compare-stat { align-items: center; background: #f4f9fc; border-radius: 10px; display: flex; font-size: 13px; justify-content: space-between; padding: 10px; }
      .compare-stat b { color: var(--ink); }
      .crowd-pill { border-radius: 999px; font-size: 12px; font-weight: 800; padding: 4px 8px; }
      .crowd-pill.easy { background: #e1f3ff; color: #147ab5; }
      .crowd-pill.normal { background: #fff5cc; color: #8b6500; }
      .crowd-pill.busy { background: #ffe4e1; color: #be342c; }
      .activity-panel { margin-top: 28px; }
      .activity-tabs, .skill-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
      .activity-tab, .skill-tab { background: #fff; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-weight: 800; padding: 10px 13px; }
      .activity-tab.on, .skill-tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
      .skill-tabs { margin-top: 10px; }
      .activity-ranks { display: grid; gap: 10px; margin-top: 16px; }
      .activity-rank-card { align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; grid-template-columns: auto 1fr auto; padding: 15px; }
      .activity-medal { font-size: 28px; }
      .activity-rank-card h3 { margin: 0; font-size: 17px; }
      .activity-rank-card p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 5px 0 0; }
      .activity-score { color: var(--blue); font-size: 20px; font-weight: 900; }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .section-head h2 {
        margin: 5px 0 0;
        font-size: 27px;
      }
      .eyebrow {
        color: var(--blue);
        font-weight: 850;
        font-size: 11px;
        letter-spacing: 0.15em;
      }
      .location-btn,
      .map-btn {
        border: 0;
        border-radius: 11px;
        background: var(--blue);
        color: #fff;
        padding: 11px 14px;
        font-weight: 750;
      }
      .map-wrap {
        position: relative;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      #map {
        height: 520px;
      }
      .filters {
        position: absolute;
        z-index: 500;
        top: 14px;
        left: 14px;
        width: 245px;
        background: #fffffff2;
        backdrop-filter: blur(12px);
        border: 1px solid #dce8ed;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 12px 28px #062b6828;
      }
      .filters strong {
        display: block;
        margin-bottom: 8px;
      }
      .filter-group + .filter-group {
        border-top: 1px solid rgba(15, 61, 89, 0.1);
        margin-top: 8px;
        padding-top: 8px;
      }
      .filter.master { font-weight: 800; }
      .subfilters {
        border-left: 2px solid rgba(23, 143, 229, 0.16);
        margin: 3px 0 3px 9px;
        padding-left: 12px;
      }
      .subfilters .filter { font-size: 12px; padding: 4px 0; }
      .filter input:indeterminate { accent-color: #7c8b96; }
      .filter {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 3px;
        font-size: 13px;
      }
      .filter input {
        width: 17px;
        height: 17px;
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .blue {
        background: #178fe5;
      }
      .yellow {
        background: #f1b928;
      }
      .red {
        background: #e94c44;
      }
      .mock-badge {
        background: #fff3cd;
        border: 1px solid #f0c44d;
        border-radius: 7px;
        color: #6b4d00;
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        margin-bottom: 7px;
        padding: 4px 7px;
      }
      .popup-address {
        border-top: 1px solid #e6edf2;
        color: #365565;
        font-size: 12px;
        line-height: 1.45;
        margin-top: 8px;
        padding-top: 7px;
      }
      .map-hint {
        padding: 11px 15px;
        background: #f7fbfd;
        color: var(--muted);
        font-size: 12px;
      }
      .pin {
        width: 30px;
        height: 30px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 3px solid #fff;
        box-shadow: 0 3px 10px #002a5555;
      }
      .pin span {
        display: block;
        transform: rotate(45deg);
        text-align: center;
        line-height: 24px;
        font-size: 13px;
      }
      .smart-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .rank-tabs {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 5px;
      }
      .rank-tab {
        white-space: nowrap;
        border: 1px solid var(--line);
        background: #f1f6f8;
        color: #466276;
        border-radius: 999px;
        padding: 10px 13px;
        font-weight: 700;
      }
      .rank-tab.on {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .algorithm {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .algorithm span {
        background: var(--sky);
        color: #116b9a;
        padding: 7px 9px;
        border-radius: 9px;
        font-size: 12px;
      }
      .rank-list {
        display: grid;
        gap: 11px;
      }
      .rank-card {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .rank-card:first-child {
        border: 2px solid #25a9e4;
        background: linear-gradient(135deg, #eaf9ff, #fff);
        box-shadow: 0 10px 25px #15a3e11c;
      }
      .medal {
        font-size: 25px;
      }
      .rank-card h3 {
        margin: 0 0 7px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .stat {
        background: #f2f6f8;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .crowd-easy {
        color: #067bb2;
        background: #daf4ff;
      }
      .crowd-normal {
        color: #946000;
        background: #fff0ba;
      }
      .crowd-busy {
        color: #b42b27;
        background: #ffe1df;
      }
      .score {
        font-size: 27px;
        font-weight: 850;
        color: var(--blue);
        text-align: center;
      }
      .score small {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .score .map-btn {
        font-size: 11px;
        padding: 8px;
        margin-top: 6px;
      }
      .disclaimer {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        margin-top: 14px;
      }
      .leaflet-popup-content {
        font-family: Pretendard, sans-serif;
        min-width: 210px;
      }
      .popup-title {
        font-weight: 850;
        font-size: 15px;
        margin-bottom: 5px;
      }
      .popup-cat {
        font-size: 11px;
        color: #fff;
        padding: 4px 7px;
        border-radius: 99px;
        display: inline-block;
      }
      .popup-desc {
        font-size: 12px;
        line-height: 1.5;
        margin: 8px 0;
      }
      .popup-meta {
        font-size: 11px;
        color: #607485;
      }
      .foot {
        background: #062b68;
        color: #d5edff;
        padding: 32px 0;
        font-size: 12px;
        line-height: 1.7;
      }
      .foot b {
        color: #fff;
        font-size: 17px;
      }
      .leaflet-control-attribution {
        font-size: 9px !important;
      }
      @media (max-width: 720px) {
        .shell {
          padding: 0 14px;
        }
        .brand img {
          width: 42px;
          height: 42px;
        }
        .brand b {
          font-size: 20px;
        }
        .hero-copy {
          padding-top: 45px;
        }
        .hero-copy p {
          font-size: 15px;
        }
        .beach-tabs {
          gap: 7px;
        }
        .mode-switcher { gap: 7px; }
        .mode-btn { font-size: 14px; padding: 15px 9px; }
        .beach-tab {
          padding: 13px 7px;
          font-size: 13px;
        }
        .section-head {
          align-items: start;
          flex-direction: column;
        }
        #map {
          height: 570px;
        }
        .filters {
          position: relative;
          top: auto;
          left: auto;
          width: auto;
          border: 0;
          border-radius: 0;
          border-bottom: 1px solid var(--line);
          box-shadow: none;
        }
        .map-wrap {
          display: flex;
          flex-direction: column;
        }
        .filters {
          order: 0;
        }
        #map {
          order: 1;
        }
        .map-hint {
          order: 2;
        }
        .rank-card {
          grid-template-columns: auto 1fr;
        }
        .compare-grid { grid-template-columns: 1fr; }
        .activity-rank-card { grid-template-columns: auto 1fr; }
        .activity-score { grid-column: 2; }
        .score {
          grid-column: 2;
          text-align: left;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .score small {
          display: inline;
        }
        .score .map-btn {
          margin: 0;
        }
        .topbar {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="shell">
        <div class="topbar">
          <div class="brand">
            <img src="badanow-logo.png" alt="바다나우 파도 로고" />
            <div><b>BADANOW</b><small>BUSAN BEACH GUIDE</small></div>
          </div>
          <select id="languageSelect" class="lang" aria-label="Language">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <div class="hero-copy">
          <div class="kicker">BUSAN FACILITY MAP</div>
          <h1 id="heroTitle"></h1>
          <p id="heroSub"></p>
          <div class="mock-note" id="mockNote"></div>
        </div>
      </div>
    </header>
    <main class="shell">
      <div class="mode-switcher" id="modeSwitcher"></div>
      <div id="mapView" class="view-panel">
        <div class="beach-tabs" id="beachTabs"></div>
        <section class="section">
        <div class="section-head">
          <div>
            <div class="eyebrow">BEACH MAP</div>
            <h2 id="mapTitle"></h2>
          </div>
          <button id="locateBtn" class="location-btn"></button>
        </div>
        <div class="map-wrap">
          <aside class="filters" id="filterPanel">
            <strong id="filterTitle"></strong>
            <div class="filter-group" data-master="basic">
              <label class="filter master"><input type="checkbox" checked /><i class="legend-dot blue"></i><span data-i18n="basic"></span></label>
              <div class="subfilters">
                <label class="filter"><input data-sub="store" type="checkbox" checked /><span>🏪</span><span data-i18n="storeFilter"></span></label>
                <label class="filter"><input data-sub="trash" type="checkbox" checked /><span>🗑️</span><span data-i18n="trashFilter"></span></label>
                <label class="filter"><input data-sub="parking" type="checkbox" checked /><span>🅿️</span><span data-i18n="parkingFilter"></span></label>
                <label class="filter"><input data-sub="toilet" type="checkbox" checked /><span>🚻</span><span data-i18n="toiletFilter"></span></label>
              </div>
            </div>
            <div class="filter-group" data-master="care">
              <label class="filter master"><input type="checkbox" checked /><i class="legend-dot yellow"></i><span data-i18n="care"></span></label>
              <div class="subfilters">
                <label class="filter"><input data-sub="shower" type="checkbox" checked /><span>🚿</span><span data-i18n="showerFilter"></span></label>
                <label class="filter"><input data-sub="rental" type="checkbox" checked /><span>🏄</span><span data-i18n="rentalFilter"></span></label>
                <label class="filter"><input data-sub="clinic" type="checkbox" checked /><span>🏥</span><span data-i18n="clinicFilter"></span></label>
              </div>
            </div>
            <div class="filter-group" data-master="risk">
              <label class="filter master"><input type="checkbox" checked /><i class="legend-dot red"></i><span data-i18n="risk"></span></label>
              <div class="subfilters">
                <label class="filter"><input data-sub="marineRisk" type="checkbox" checked /><span>🪼</span><span data-i18n="marineRiskFilter"></span></label>
                <label class="filter"><input data-sub="healthRisk" type="checkbox" checked /><span>👥</span><span data-i18n="healthRiskFilter"></span></label>
              </div>
            </div>
          </aside>
          <div id="map"></div>
          <div class="map-hint" id="mapHint"></div>
        </div>
        </section>
        <section class="section" id="smartRankingSection">
          <div class="section-head">
            <div>
              <div class="eyebrow">SMART RANKING</div>
              <h2 id="rankTitle"></h2>
            </div>
          </div>
          <div class="smart-panel">
            <div class="rank-tabs" id="rankTabs"></div>
            <div class="algorithm" id="algorithm"></div>
            <div class="rank-list" id="rankList"></div>
            <p class="disclaimer" id="disclaimer"></p>
          </div>
        </section>
      </div>
      <div id="rankingView" class="view-panel" hidden>
        <section class="section">
          <div class="section-head">
            <div>
              <div class="eyebrow">BEACH OVERVIEW</div>
              <h2 id="compareTitle"></h2>
            </div>
          </div>
          <div class="compare-grid" id="compareGrid"></div>
          <div class="activity-panel">
            <div class="section-head">
              <div>
                <div class="eyebrow">ACTIVITY PICK</div>
                <h2 id="activityTitle"></h2>
              </div>
            </div>
            <div class="activity-tabs" id="activityTabs"></div>
            <div class="skill-tabs" id="skillTabs"></div>
            <div class="activity-ranks" id="activityRanks"></div>
          </div>
        </section>
      </div>
    </main>
    <footer class="foot">
      <div class="shell">
        <b>BADANOW</b>
        <div id="footerText"></div>
      </div>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script>
      const beaches = {
        gwangan: {
          center: [35.1532, 129.1186],
          zoom: 16,
          n: { ko: "광안리", en: "Gwangalli", zh: "广安里" },
        },
        haeundae: {
          center: [35.1587, 129.1604],
          zoom: 16,
          n: { ko: "해운대", en: "Haeundae", zh: "海云台" },
        },
        songjeong: {
          center: [35.1786, 129.1993],
          zoom: 16,
          n: { ko: "송정", en: "Songjeong", zh: "松亭" },
        },
      };
      const P = [
        [
          "gwangan",
          "parking",
          "basic",
          35.15385,
          129.11915,
          "광안리해수욕장 공영주차장",
          "Gwangalli Beach Public Parking",
          "广安里海水浴场公营停车场",
          "광안동 198-3, 해변 도보 약 2분",
          "Gwangandong 198-3, about 2 min on foot",
          "广安洞198-3，步行约2分钟",
          4.6,
          "normal",
          "10분 300원 · 1일 8,000원",
          300,
        ],
        [
          "gwangan",
          "parking",
          "basic",
          35.15605,
          129.1232,

      function renderActivityRanks() {
        activityTitle.textContent = text("activityTitle");
        activityTabs.innerHTML = [["swim", text("swim")], ["fishing", text("fishing")], ["surfing", text("surfing")], ["walk", text("walk")]].map(([key, label]) => `<button class="activity-tab ${activity === key ? "on" : ""}" onclick="activity='${key}';renderActivityRanks()">${label}</button>`).join("");
        skillTabs.innerHTML = activity === "surfing" ? [["beginner", text("beginner")], ["advanced", text("advanced")]].map(([key,label]) => `<button class="skill-tab ${surfLevel === key ? "on" : ""}" onclick="surfLevel='${key}';renderActivityRanks()">${label}</button>`).join("") : "";
        const places = Object.keys(beaches).map((id) => ({ id, score: activityScore(id) })).sort((a,b) => b.score - a.score);
        activityRanks.innerHTML = places.map((entry, index) => `<article class="activity-rank-card"><div class="activity-medal">${["🥇", "🥈", "🥉"][index]}</div><div><h3>${beaches[entry.id].n[lang]}</h3><p>${activityReason(entry.id)}</p></div><div class="activity-score">${entry.score}<small>/100</small></div></article>`).join("");
      }
      function setView(mode) {
        viewMode = mode;
        render();
        if (mode === "map") setTimeout(() => map.invalidateSize(), 350);
      }
      function showPin(id) {
        let p = P.find((x) => x.id === id);
        beach = p.beach;
        if (viewMode !== "map") setView("map");
        map.setView([p.lat, p.lng], 18);
        let found = markers.find((x) => x.p.id === id);
        if (!found) {
          let m = L.marker([p.lat, p.lng], { icon: icon(p) })
            .addTo(map)
            .bindPopup(() => popup(p));
          markers.push({ p, m });
          found = { p, m };
        }
        found.m.openPopup();
        document
          .querySelector(".map-wrap")
          .scrollIntoView({ behavior: "smooth" });
      }
      function render() {
        let t = tr[lang];
        modeSwitcher.innerHTML = `<button class="mode-btn ${viewMode === "map" ? "on" : ""}" onclick="setView('map')">${t.mapMode}</button><button class="mode-btn ${viewMode === "ranking" ? "on" : ""}" onclick="setView('ranking')">${t.rankMode}</button>`;
        mapView.hidden = viewMode !== "map";
        rankingView.hidden = viewMode !== "ranking";
        heroTitle.innerHTML = t.hero.replace("\n", "<br>");
        heroSub.textContent = t.sub;
        mockNote.textContent = t.mock;
        mapTitle.textContent = t.map;
        locateBtn.textContent = t.loc;
        filterTitle.textContent = t.filter;
        document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = t[el.dataset.i18n]);
        mapHint.textContent = t.hint;
        rankTitle.textContent = t.rank;
        footerText.textContent = t.footer;
        beachTabs.innerHTML = Object.entries(beaches)
          .map(
            ([k, b]) =>
              `<button class="beach-tab ${k === beach ? "on" : ""}" onclick="switchBeach('${k}')">${b.n[lang]}</button>`,
          )
          .join("");
        let rc = [
          ["parking", t.parking],
          ["store", t.store],
          ["care", t.careTab],
          ["rental", t.rental],
        ];
        rankTabs.innerHTML = rc
          .map(
            ([k, v]) =>
              `<button class="rank-tab ${k === rankCat ? "on" : ""}" onclick="rankCat='${k}';render()">${v}</button>`,
          )
          .join("");
        algorithm.innerHTML = t.algo.map((x) => `<span>${x}</span>`).join("");
        disclaimer.textContent = t.disc;
        drawMarkers();
        rankPlaces();
        renderComparison();
        renderActivityRanks();
      }
      function switchBeach(k) {
        beach = k;
        map.flyTo(beaches[k].center, beaches[k].zoom);
        render();
      }
      document.querySelectorAll(".filter-group").forEach((group) => {
        const master = group.querySelector(".master input");
        const children = [...group.querySelectorAll("[data-sub]")];
        master.addEventListener("change", () => {
          children.forEach((child) => child.checked = master.checked);
          master.indeterminate = false;
          drawMarkers();
        });
        children.forEach((child) => child.addEventListener("change", () => {
          const checked = children.filter((item) => item.checked).length;
          master.checked = checked === children.length;
          master.indeterminate = checked > 0 && checked < children.length;
          drawMarkers();
        }));
      });
      languageSelect.onchange = (e) => {
        lang = e.target.value;
        document.documentElement.lang = lang;
        render();
      };
      locateBtn.onclick = () => {
        locateBtn.textContent = text("locating");
        navigator.geolocation.getCurrentPosition(
          (p) => {
            userPos = [p.coords.latitude, p.coords.longitude];
            L.circleMarker(userPos, {
              radius: 8,
              color: "#fff",
              weight: 3,
              fillColor: "#112f79",
              fillOpacity: 1,
            })
              .addTo(map)
              .bindPopup(text("youHere"));
            locateBtn.textContent = text("loc");
            rankPlaces();
            drawMarkers();
            renderComparison();
          },
          () => {
            locateBtn.textContent = text("denied");
          },
          { timeout: 10000 },
        );
      };
      render();
    </script>
  </body>
</html>
