<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badanow</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');*{box-sizing:border-box}body{margin:0;background:#f4f8fa;color:#102f43;font-family:Pretendard,Arial}.hero{color:#fff;padding:25px max(20px,calc((100% - 1050px)/2)) 85px;background:linear-gradient(#043251aa,#057daaaa),url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80') center/cover}nav{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:35px 20px}h1{font-size:clamp(32px,6vw,56px);margin:70px 0 10px}.note,.alert{background:#fff;border-radius:12px;padding:14px;margin:10px 0}.note{border:1px solid #b7ddeb;background:#edf9ff}.alert{border-left:5px solid #e44b40}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,select{font:inherit;padding:10px 14px;border:0;border-radius:9px}.tabs button{background:#e0ebef}.tabs button.on{background:#087fb8;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;padding:16px;border-radius:15px;border:1px solid #dce8ed}.rank{display:flex;gap:14px;align-items:center}.rank>div{flex:1}.gauge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:conic-gradient(#087fb8 calc(var(--v)*1%),#dce8ed 0)}.gauge i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff;font-style:normal}.met{font-size:13px;color:#55707d;margin-top:9px}.crowd{float:right;padding:5px 8px;border-radius:20px;background:#dff4ff}.near button{background:#087fb8;color:#fff;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:700}.dist p{display:flex;background:#fff;padding:12px;border-radius:8px}.dist b{margin-right:12px}.dist strong{margin-left:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><nav><span class="brand">◉ BADANOW</span><select id="lang" onchange="render()"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></nav><h1 id="head"></h1><p id="sub"></p></header><main class="wrap"><h2 id="safe"></h2><div class="note" id="mock"></div><div class="alert" id="alerts"></div><h2 id="ask"></h2><div class="tabs" id="tabs"></div><div id="level"></div><h2 id="rank"></h2><section class="grid" id="ranks"></section><h2 id="sea"></h2><section class="grid" id="cards"></section><section class="near"><h2 id="near"></h2><p id="privacy"></p><button id="loc" onclick="geo()"></button><div class="dist" id="dist"></div></section></main><script>const B=[['\uad11\uc548\ub9ac','Gwangalli','\u5e7f\u5b89\u91cc',35.153,129.119,25.8,.45,3.2,29,'busy'],['\ud574\uc6b4\ub300','Haeundae','\u6d77\u4e91\u53f0',35.159,129.160,25.5,.72,5.8,28,'very'],['\uc1a1\uc815','Songjeong','\u677e\u4ead',35.179,129.199,24.9,.88,4.6,27,'normal'],['\uc1a1\ub3c4','Songdo','\u677e\u5c9b',35.076,129.017,25.1,.31,2.4,28,'easy'],['\ub2e4\ub300\ud3ec','Dadaepo','\u591a\u5927\u6d66',35.047,128.965,24.6,.58,3.7,27,'none']];let a='swim',lvl='begin';const T={ko:{head:'\ubd80\uc0b0 \ubc14\ub2e4\ub97c \ub354 \uc548\uc804\ud558\uace0 \uc54c\ucc28\uac8c',sub:'\ud604\uc7ac \ubc14\ub2e4 \uc0c1\ud0dc\uc640 \ub098\uc5d0\uac8c \ub9de\ub294 \ud574\ubcc0\uc744 \ud55c\ub208\uc5d0',safe:'\uc624\ub298\uc758 \uc548\uc804 \uc54c\ub9bc',mock:'\u24d8 \ud604\uc7ac \ud45c\uc2dc\ub418\ub294 \ub370\uc774\ud130\ub294 \uac1c\ubc1c\uc6a9 \ubaa8\uc758 \ub370\uc774\ud130\uc785\ub2c8\ub2e4.',ask:'\uc5b4\ub5a4 \ud65c\ub3d9\uc744 \uacc4\ud68d\ud558\uace0 \uc788\ub098\uc694?',rank:'\ucd94\ucc9c \uc21c\uc704',sea:'\ud604\uc7ac \ud574\uc591\u00b7\ub0a0\uc528',near:'\ub0b4 \uc704\uce58\uc5d0\uc11c \uac00\uae4c\uc6b4 \ud574\ubcc0',loc:'\u2316 \ub0b4 \uc704\uce58 \uae30\uc900 \ubcf4\uae30',privacy:'\uc704\uce58 \uc815\ubcf4\ub294 \uc774 \uae30\uae30\uc5d0\uc11c\ub9cc \uc0ac\uc6a9\ud558\uba70 \uc800\uc7a5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.',acts:['\ubb3c\ub180\uc774','\ub0a9\uc2dc','\uc11c\ud551','\uc0b0\ucc45'],begin:'\ucd08\ubcf4\uc790',adv:'\uc219\ub828\uc790',alert:'\u26a0 \ud574\uc6b4\ub300: \uc774\uc548\ub958 \uc8fc\uc758 \u2014 \uc785\uc218 \uc804 \ud604\uc7a5 \uc548\uc804\uc694\uc6d0\uc758 \uc548\ub0b4\ub97c \ud655\uc778\ud558\uc138\uc694.'},en:{head:'Explore Busan\u2019s coast, safely',sub:'Live sea conditions and the right beach at a glance',safe:'Today\u2019s safety alerts',mock:'\u24d8 The information currently shown is development mock data.',ask:'What are you planning today?',rank:'Recommended beaches',sea:'Sea & weather now',near:'Beaches near me',loc:'\u2316 Use my location',privacy:'Your location is used only on this device and is never stored.',acts:['Swimming','Fishing','Surfing','Walking'],begin:'Beginner',adv:'Advanced',alert:'\u26a0 Haeundae: rip-current caution \u2014 check lifeguard guidance before entering the water.'},zh:{head:'\u5b89\u5fc3\u63a2\u7d22\u91dc\u5c71\u6d77\u5cb8',sub:'\u4e00\u89c8\u5f53\u524d\u6d77\u51b5\u4e0e\u9002\u5408\u60a8\u7684\u6d77\u6ee9',safe:'\u4eca\u65e5\u5b89\u5168\u63d0\u793a',mock:'\u24d8 \u5f53\u524d\u663e\u793a\u7684\u4fe1\u606f\u4e3a\u5f00\u53d1\u6a21\u62df\u6570\u636e\u3002',ask:'\u60a8\u4eca\u5929\u8ba1\u5212\u4ec0\u4e48\u6d3b\u52a8\uff1f',rank:'\u63a8\u8350\u6392\u540d',sea:'\u5f53\u524d\u6d77\u51b5\u4e0e\u5929\u6c14',near:'\u79bb\u6211\u6700\u8fd1\u7684\u6d77\u6ee9',loc:'\u2316 \u6309\u6211\u7684\u4f4d\u7f6e\u67e5\u770b',privacy:'\u4f4d\u7f6e\u4fe1\u606f\u4ec5\u5728\u672c\u8bbe\u5907\u4f7f\u7528\uff0c\u4e0d\u4f1a\u4fdd\u5b58\u3002',acts:['\u620f\u6c34','\u9493\u9c7c','\u51b2\u6d6a','\u6563\u6b65'],begin:'\u521d\u5b66\u8005',adv:'\u8fdb\u9636',alert:'\u26a0 \u6d77\u4e91\u53f0\uff1a\u6ce8\u610f\u79bb\u5cb8\u6d41 \u2014 \u5165\u6c34\u524d\u8bf7\u786e\u8ba4\u6551\u751f\u5458\u6307\u5f15\u3002'}};function nm(b,l){return b[l=='ko'?0:l=='en'?1:2]}function sc(b){let s=55;if(a=='swim')s+=(1-b[6])*25+(6-b[7])*2;if(a=='fish')s+=(1-b[6])*30+(7-b[7])*3+(lvl=='begin'?(b[6]<.6?10:-10):0);if(a=='surf')s+=25-Math.abs(b[6]-(lvl=='begin'?.8:1.3))*30;if(a=='walk')s+=(7-b[7])*2;if(b[9]=='very')s-=30;return Math.max(5,Math.min(100,Math.round(s)))}function render(){let l=lang.value,t=T[l];for(let k of ['head','sub','safe','mock','ask','rank','sea','near','loc','privacy'])document.getElementById(k).textContent=t[k];alerts.textContent=t.alert;tabs.innerHTML=t.acts.map((x,i)=>`<button class="${a==['swim','fish','surf','walk'][i]?'on':''}" onclick="a='${['swim','fish','surf','walk'][i]}';render()">${x}</button>`).join('');level.innerHTML=a=='fish'||a=='surf'?`<p><button onclick="lvl='begin';render()">${t.begin}</button> <button onclick="lvl='adv';render()">${t.adv}</button></p>`:'';let r=[...B].sort((x,y)=>sc(y)-sc(x));ranks.innerHTML=r.map((b,i)=>`<article class="card rank"><b>${i+1}</b><div><h3>${nm(b,l)}</h3><small>${t.acts[['swim','fish','surf','walk'].indexOf(a)]}</small><div class="met">Wave ${b[6]}m · Wind ${b[7]}m/s</div></div><span class="gauge" style="--v:${sc(b)}"><i>${sc(b)}</i></span></article>`).join('');cards.innerHTML=B.map(b=>`<article class="card"><span class="crowd">● ${b[9]}</span><h3>${nm(b,l)}</h3><div class="met">Water ${b[5]}° · Wave ${b[6]}m · Wind ${b[7]}m/s · Air ${b[8]}°</div></article>`).join('')}function geo(){navigator.geolocation.getCurrentPosition(p=>{let d=(a,b,c,e)=>6371*2*Math.asin(Math.sqrt(Math.sin((c-a)*Math.PI/360)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin((e-b)*Math.PI/360)**2));dist.innerHTML=B.map(b=>[b,d(p.coords.latitude,p.coords.longitude,b[3],b[4])]).sort((x,y)=>x[1]-y[1]).map((x,i)=>`<p><b>${i+1}</b>${nm(x[0],lang.value)}<strong>${x[1].toFixed(1)} km</strong></p>`).join('')},()=>{loc.textContent='Location unavailable'})}render()</script></body></html>
